name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build with a button click

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build Web App Component
        run: |
          cd Haven-iOS/WebApp
          npm install
          npm run build
          cd ../..

      - name: Build Xcode Workspace
        run: |
          xcodebuild -project Haven-iOS/Haven.xcodeproj \
                     -scheme Haven \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/Haven.app Payload/
          zip -r Haven.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Unsigned-IPA
          path: Haven.ipa
